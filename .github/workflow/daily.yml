name: Run script daily

on:
  schedule:
    - cron: '0 0 * * *'  # 00:00 UTC every day = 1am Lagos time
  workflow_dispatch:      # manual run button

jobs:
  run-script:
    runs-on: ubuntu-latest

    # Grants permission to commit changes back to your repo
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run my script
        run: node serverm.js  # Make sure this matches your actual script file name inside scripts/

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update site data" && git push)
