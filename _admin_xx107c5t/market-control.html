<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineRoth | Market control</title>
    <link rel="stylesheet" href="assets/admin.css">
</head>
<body>
    <p style="text-align: center;">
        <img src="../res/Icon.png" width="40px">
    </p>
    <p class="term">This is for Admins only.</p>
    <p class="term" id="status">Loading...</p>
    <div class="pred" id="profit">Give out: ---</div>
    <br>
    <div class="pred" style="padding: 10px 20px;">
        <p>Traders on board</p>
        <table class="compare">
            <tr>
                <th>HIGHs</th>
                <th>LOWs</th>
            </tr>
            <tr>
                <td id="highers">...</td>
                <td id="lowers">...</td>
            </tr>
        </table>
        <p class="term" id="state">State: waiting</p>
        <br>
        <p style="text-align: center;">
            <button class="grn-btn prd" onclick="give('high')">Give HIGH</button>
            <button class="red-btn prd" onclick="give('low')">Give LOW</button>
            <button class="snt-btn prd" onclick="pauseMK()">Pause</button>
        </p>
    </div>
    <br>
    <p style="text-align: center;">
        <button class="cls" style="margin: 0 5px;" onclick="openMK()">Open Market</button>
        <button class="cls" style="margin: 0 5px;" onclick="closeMK()">Close Market</button>
    </p>
    <script type="importmap">
        {
            "imports": {
                "jquery": "../scripts/jquery-4.module.js"
            }
        }
    </script>
    <div id="secret"></div>
    <script type="module" src="ma7uqi.js"></script>
    <script type="module" src="assets/market.js"></script>
</body>
</html>
