<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - Dark Theme</title>
    <link rel="stylesheet" href="../../css/sett.css">
    <link rel="stylesheet" href="../../css/app.css">
</head>
<body>

<div class="settings-container">
  <button id="loc-helper" onclick="history.back()">&LeftArrow; Back</button>
    <div class="header">
        <h1>Account Settings</h1>
        <p>Manage your personal profile, security credentials, and banking details.</p>
    </div>

    <form id="form">
        <!-- Profile Details -->
        <div class="card">
            <h2>Personal Information</h2>
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" style="text-transform: capitalize;" id="fullName" name="fullName" placeholder="e.g. Jane Doe" required>
            </div>
        </div>

        <!-- Security / Password -->
        <div class="card">
            <h2>Change Password</h2>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="text" id="newPassword" minlength="4" maxlength="4" name="newPassword" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="text" id="confirmPassword" minlength="4" maxlength="4" name="confirmPassword" placeholder="••••••••" required>
            </div>
        </div>

        <!-- Banking Details -->
        <div class="card">
            <h2>Bank Details</h2>
            <div class="form-group">
                <label for="bankName">Bank Name</label>
                <input type="text" id="bankName" name="bankName" placeholder="e.g. Chase, First Bank, etc." required>
            </div>
            <div class="form-group">
                <label for="accountNumber">Account Number</label>
                <input type="text" id="accountNumber" name="accountNumber" placeholder="e.g. 1234567890" required>
            </div>
        </div>

        <!-- Submit Button -->
        <div class="actions">
            <button type="submit" class="btn">Save Changes</button>
        </div>
        <br>
        <br>
    </form>
</div>
    
    <script type="importmap">
        {
            "imports": {
                "jquery": "../../scripts/jquery-4.module.js"
            }
        }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
