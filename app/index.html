<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mine Roth | App</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="shortcut icon" href="../res/Icon.png">
</head>
<body>
    <menu>
        <div style="display: flex;" onclick="aboutMR()">
            <img src="../res/Icon.png" width="25px" style="margin-right: 5px;">
            <h1>Mine Roth</h1>
            <div id="uname" 
            style="position: absolute; right: 10px;text-transform: capitalize; font-family: monospace; color: silver;">
            </div>
        </div>
    </menu>
    <iframe id="main" src="main/index.html"></iframe>
    <div id="MR" show="false">
        <div class="info">
            <span onclick="closeMR()" style="
                position: absolute; 
                right: 10px; top: 5px; 
                font-size: 20px; width: 30px; 
                text-align: center;"
            >&Cross;</span>
            <h1 class="special-text">Mine Roth</h1>
            <div style="display: flex;">
                <img src="../res/Icon.png" width="100px" height="100px" style="margin: 5px;">
                <div>
                    <p>
                        This software (MineRoth) is made by <strong>MineRoth</strong>
                        organization.
                    </p>
                </div>
            </div>
            <div>
                <p><strong>The Founders</strong></p>
                <p><i>Ayara Joshua</i> > The Developer</p>
                <p><i>Amokonmusa Peter</i> > The Enterpreneur</p>
            </div>
        </div>
    </div>
    <script type="module">
        import {SBServer} from "../scripts/sb-server.module.js";
        import MySweet from "../scripts/mySweet.js";

        const mainFrm = document.getElementById("main");
        const xCsg561 = new SBServer(
            "https://hqqykvvumlgoudkikmlx.supabase.co",
            "users",
            "sb_publishable_WUK6FDzfwvMBMd50a4HHcw_VvV7uMDs"
        ); 
        const usp = new URLSearchParams(window.location.search);
        const icon = {
        "info": "<img src='../res/icons/info-icon.png' width='20px' style='margin-right: 7px'>",
        "newyear": "<img src='../res/icons/newyear-icon.png' width='50px' style='margin-right: 7px'>",
        "warn": "<img src='../res/icons/warn-icon.png' width='30px' style='margin-right: 7px'>",
        "congrats": "<img src='../res/icons/congrats-icon.png' width='60px' style='margin-right: 7px'>",
        "christmas": "<img src='../res/icons/christmas-icon.png' width='50px' style='margin-right: 7px'>",
        "block": "<img src='../res/icons/block-icon.png' width='25px' style='margin-right: 7px'>"
        };
        verify();
        async function verify() {
           const x = await xCsg561.get(`id=eq.${usp.get("id")}&pw=eq.${usp.get("pw")}`).catch(()=> window.location.reload());
           if(x.length) {
                document.getElementById("uname").innerHTML = x[0].name;
                mainFrm.src = "main/index.html?uid="+usp.get("id");
                const upadate_db = new SBServer(
                    "https://hqqykvvumlgoudkikmlx.supabase.co",
                    "update",
                    "sb_publishable_WUK6FDzfwvMBMd50a4HHcw_VvV7uMDs"
                ); 
                const [update] = await upadate_db.get('limit=1');

// Update type check
switch (update.type) {
        // Show Update
        case 'info':
            MySweet.setTheme("light");
            await MySweet.confirm(icon[update.type] + update.head,update.body);

            break;
        case 'newyear':
            MySweet.setTheme("light");
            await MySweet.confirm(icon[update.type] + update.head,update.body);

            break;
        case 'congrats':
            MySweet.setTheme("dark");
            await MySweet.confirm(icon[update.type] + update.head,update.body);

            break;
        case 'christmas':
            MySweet.setTheme("light");
            await MySweet.confirm(icon[update.type] + update.head,update.body,{
                box: {
                    borderTop: "5px solid #ee0000"
                },
                confirmBtn: {
                    backgroundColor: "#ee0000"
                }
            });

            break;
        case 'warn':
            MySweet.setTheme("dark");
            await MySweet.confirm(icon[update.type] + update.head,update.body,{
                confirmBtn: {
                   backgroundColor: "yellow"
                },
                box: {
                    borderTop: "2px solid yellow"
                }
            });

            break;
        case 'block':
            MySweet.setTheme("danger");
            await MySweet.confirm(icon[update.type] + update.head,update.body);

            window.location.href = "../../log.hml";

            break;
    };

           } else {
                MySweet.setTheme("danger");
               await MySweet.alert("Invalid Log Data!","You must return to, Sign-In page");
               window.location.href = "../log.html?q=login"
           }
           
        }
    </script>
    <script src="../scripts/index.js"></script>
</body>
</html>
