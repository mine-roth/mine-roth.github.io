<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/app.css">
    <script src="https://js.paystack.co/v2/inline.js"></script>
</head>
<body>
    <div class="padd">
        <div id="roth-bal">
            <div style="padding: 10px;">
                <p id="roth-val">
                    <img src="../../res/icons/roth.png" width="18px"> 1 = 
                    <span id="val0"><del class="ngn">N</del>...</span>
                </p>
                <div class="out">
                    Roth: <div id="roth"></div>
                </div>
                <div class="out">
                    NGN: <div id="ngn"></div>
                </div>
                <p style="text-align: center;">
                    <button class="depo" onclick="deposit()">Deposit</button>
                    <button class="depo" onclick="withdraw()">Auto-withdraw</button>
                </p>
            </div>
        </div>
    </div>
    <div class="inst">
        <div id="instruct">
            <ul>
                <li>Dear users make sure you interact every ads to earn more.</li>
                <li>Make sure you turn off your Ad-blockers to recieve ads.</li>
                <br>
                <button class="drop-btn" onclick="moreInst()">see more</button>
            </ul>
        </div>
    </div>
    <div>
        <button class="app" onclick="gotoSett()">
            <img src="../../res/icons/mr-sett.png" width="80px">
            <br>
            <label >settings</label>
        </button>
        <a>
        <button class="app" onclick="gotoMine()">
            <img src="../../res/icons/mr-mine.png" width="80px">
            <br>
            <label >mine</label>
        </button>
        <button class="app" onclick="gotoTrade()">
            <img src="../../res/icons/mr-trade.png" width="80px">
            <br>
            <label >trade</label>
        </button>
        <button class="app" onclick="gotoUpdates()">
            <img src="../../res/icons/mr-notice..png" width="80px">
            <br>
            <label >updates</label>
        </button>
       
    </div>
    <br>
    <p style="text-align: center;">
        <a href="#">
        <button class="help">
            <img src="../../res/help.png" width="100px">
            <p>Watch Help Video</p>
        </button>
        </a>
    </p>
    <div id="ld-overlay" class="loader-overlay">
        <div class="mining-container">
          <div class="orbit-ring"></div>
          <div class="spark spark-1"></div>
          <div class="spark spark-2"></div>
          <div class="pickaxe-wrapper">
            <div class="pickaxe-head"></div>
            <div class="pickaxe-handle"></div>
          </div>
        </div>
        <div class="loading-text">Roth Booting...</div>
        <div class="progress-bar-container">
          <div class="progress-bar"></div>
        </div>
      </div>
    <script type="module" src="app.js"></script>
</body>
</html>
